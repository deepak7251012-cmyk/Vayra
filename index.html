<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VAYRA - Your Personal AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
            padding-bottom: 70px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; }

        .top-cards {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }
        .card {
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }
        .card .label { color: #00ffff; font-size: 9px; letter-spacing: 1px; }
        .card .value { color: #fff; font-weight: bold; font-size: 13px; }

        .header {
            text-align: center;
            margin: 5px 0 15px;
        }
        .header h1 {
            font-size: 2.2em;
            color: #00ffff;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            font-weight: 900;
        }
        .header p {
            font-size: 0.7em;
            color: #8b949e;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        .orb-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 15px;
        }
        #orbCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5), 0 0 120px rgba(138, 43, 226, 0.3);
        }

        .side-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 20, 30, 0.9);
            border: 2px solid rgba(0, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .side-btn:active { transform: scale(0.9); background: rgba(0, 255, 255, 0.2); }

        .btn-settings { top: 0; left: calc(50% - 130px); }
        .btn-code { top: 0; right: calc(50% - 130px); }
        .btn-chat { top: 70px; left: calc(50% - 125px); }
        .btn-work { top: 130px; left: calc(50% - 130px); }
        .btn-memory { top: 190px; left: calc(50% - 125px); }
        .btn-reminder { top: 70px; right: calc(50% - 125px); }
        .btn-record { top: 130px; right: calc(50% - 130px); }
        .btn-apps { top: 190px; right: calc(50% - 125px); }

        .side-btn .label {
            position: absolute;
            bottom: -18px;
            font-size: 9px;
            color: #8b949e;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .design-screen {
            background: rgba(0, 15, 25, 0.9);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .design-screen:active { transform: scale(0.98); }
        .design-screen .placeholder {
            color: #00ffff;
            font-size: 14px;
            text-align: center;
            letter-spacing: 1px;
        }
        .design-screen .placeholder span { font-size: 20px; display: block; margin-bottom: 5px; }

        .status-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        .status-card {
            flex: 1;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            color: #8b949e;
        }
        .status-card .wave {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2px;
            height: 20px;
            margin-top: 4px;
        }
        .status-card .wave span {
            width: 3px;
            background: #00ffff;
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }
        .status-card .wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .status-card .wave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
        .status-card .wave span:nth-child(3) { height: 18px; animation-delay: 0.2s; }
        .status-card .wave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
        .status-card .wave span:nth-child(5) { height: 8px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        .chat-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 25px;
            padding: 10px 15px;
            margin: 10px 0;
        }
        .chat-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .chat-box input::placeholder { color: #8b949e; }
        .mic-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transition: all 0.3s;
        }
        .mic-btn:active { transform: scale(0.9); background: #00ffff; color: #000; }

        .chat-hint {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 15px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0, 15, 25, 0.95);
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            padding: 8px 5px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }
        .bottom-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #8b949e;
            font-size: 9px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .bottom-btn .icon {
            font-size: 18px;
            color: #00ffff;
        }
        .bottom-btn:active { color: #00ffff; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 100;
            padding: 15px;
            flex-direction: column;
        }
        .modal.active { display: flex; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h2 { color: #00ffff; font-size: 1.2em; letter-spacing: 2px; }
        .close-btn {
            background: none;
            border: 2px solid #ff4444;
            color: #ff4444;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-canvas {
            flex: 1;
            background: rgba(0, 20, 30, 0.8);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            margin-bottom: 15px;
        }
        .modal-input {
            display: flex;
            gap: 8px;
        }
        .modal-input input {
            flex: 1;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .modal-input button {
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #00ffff;
            color: #00ffff;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-cards">
            <div class="card">
                <div class="label">TIME</div>
                <div class="value" id="time">10:09 AM</div>
            </div>
            <div class="card" style="text-align:right;">
                <div class="label">DATE</div>
                <div class="value" id="date">OCT 26</div>
            </div>
        </div>
        <div class="top-cards">
            <div class="card">
                <div class="label">BATTERY</div>
                <div class="value" id="battery">88%</div>
            </div>
            <div class="card" style="text-align:right;">
                <div class="label">SIGNAL</div>
                <div class="value">5G | Wi-Fi</div>
            </div>
        </div>

        <div class="header">
            <h1>VAYRA</h1>
            <p>Your Personal AI Assistant</p>
        </div>

        <div class="orb-container">
            <canvas id="orbCanvas" width="440" height="440"></canvas>
            
            <button class="side-btn btn-settings" onclick="toast('Settings खुल रही है...')">⚙️<span class="label">Settings</span></button>
            <button class="side-btn btn-code" onclick="toast('Code Editor खुल रहा है...')">&lt;/&gt;<span class="label">Code</span></button>
            <button class="side-btn btn-chat" onclick="toast('Chat खुल रही है...')">💬<span class="label">Chat</span></button>
            <button class="side-btn btn-work" onclick="toast('Work खुल रहा है...')">💼<span class="label">Work</span></button>
            <button class="side-btn btn-memory" onclick="toast('Memory खुल रही है...')">🧠<span class="label">Memory</span></button>
            <button class="side-btn btn-reminder" onclick="toast('Reminder सेट हो रहा है...')">🔔<span class="label">Reminder</span></button>
            <button class="side-btn btn-record" onclick="toast('Recording शुरू...')">⏺️<span class="label">Record</span></button>
            <button class="side-btn btn-apps" onclick="toast('Apps खुल रहे हैं...')">▦<span class="label">Apps</span></button>
        </div>

        <div class="design-screen" onclick="openDesignModal()">
            <div class="placeholder">
                <span>✦</span>
                Yahan kuch banao...
            </div>
        </div>

        <div class="status-row">
            <div class="status-card">
                Listening...
                <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="status-card">
                Thinking...
                <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="status-card">
                Speaking...
                <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
            </div>
        </div>

        <div class="chat-box">
            <span style="color:#00ffff;">💬</span>
            <input type="text" id="chatInput" placeholder="Tap to speak or type...">
            <button class="mic-btn" onclick="startVoice()">🎤</button>
        </div>
        <div class="chat-hint">Kuch bhi puchho... main yahan hoon ♡</div>
    </div>

    <div class="bottom-bar">
        <button class="bottom-btn" onclick="toast('Backup...')"><span class="icon">☁️</span>Backup</button>
        <button class="bottom-btn" onclick="toast('History...')"><span class="icon">🕐</span>History</button>
        <button class="bottom-btn" onclick="toast('Help...')"><span class="icon">❓</span>Help</button>
        <button class="bottom-btn" onclick="toast('Theme बदल रही है...')"><span class="icon">🌙</span>Theme</button>
        <button class="bottom-btn" onclick="toast('Color बदल रहा है...')"><span class="icon">🎨</span>Color</button>
        <button class="bottom-btn" onclick="toast('Sound...')"><span class="icon">🔊</span>Sound</button>
    </div>

    <div class="modal" id="designModal">
        <div class="modal-header">
            <h2>DESIGN PREVIEW</h2>
            <button class="close-btn" onclick="closeDesignModal()">✕</button>
        </div>
        <div class="modal-canvas" id="modalCanvas">
            Yahan tumhara design dikhega...<br><br>
            <small>Vayra se kuch banao...</small>
        </div>
        <div class="modal-input">
            <input type="text" id="designInput" placeholder="Kuch bhi banao...">
            <button onclick="toast('Design ban raha hai...')">✦</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const canvas = document.getElementById('orbCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const cx = w/2, cy = h/2;
        const particles = [];
        const ringParticles = [];

        for (let i = 0; i < 400; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 130;
            particles.push({
                angle: angle,
                radius: radius,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.01 + 0.005,
                color: Math.random() > 0.5 ? '#00ffff' : '#8a2be2',
                phase: Math.random() * Math.PI * 2
            });
        }

        for (let i = 0; i < 100; i++) {
            ringParticles.push({
                angle: Math.random() * Math.PI * 2,
                radius: 160 + Math.random() * 40,
                size: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 0.005 + 0.002,
                color: '#00ffff'
            });
        }

        let time = 0;
        function drawOrb() {
            ctx.clearRect(0, 0, w, h);
            time += 0.02;

            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 200);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.15)');
            gradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);

            particles.forEach(p => {
                p.angle += p.speed;
                const x = cx + Math.cos(p.angle) * p.radius;
                const y = cy + Math.sin(p.angle) * p.radius * 0.85;
                const pulse = Math.sin(time + p.phase) * 0.5 + 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, p.size * (0.8 + pulse * 0.4), 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.4 + pulse * 0.4;
                ctx.fill();
            });

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx - 40, cy - 15, 15, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 40, cy - 15, 15, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(cx, cy + 25, 30, 0.1, Math.PI - 0.1);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ringParticles.forEach(p => {
                p.angle += p.speed;
                const x = cx + Math.cos(p.angle) * p.radius;
                const y = cy + Math.sin(p.angle) * p.radius * 0.4;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.6;
                ctx.fill();
            });

            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(cx, cy, 190, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.globalAlpha = 1;
            requestAnimationFrame(drawOrb);
        }
        drawOrb();

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time').textContent = timeStr;
            const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }).toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                document.getElementById('battery').textContent = Math.round(b.level * 100) + '%';
                b.addEventListener('levelchange', () => {
                    document.getElementById('battery').textContent = Math.round(b.level * 100) + '%';
                });
            });
        }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                toast('Voice support नहीं है');
                return;
            }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SR();
            recognition.lang = 'hi-IN';
            recognition.start();
            toast('सुन रही हूँ...');
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('chatInput').value = text;
                toast('तुमने कहा: ' + text);
                speak('ठीक है दोस्त, मैं सुन रही हूँ!');
            };
            recognition.onerror = () => toast('फिर से कोशिश करो...');
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'hi-IN';
                u.rate = 1;
                speechSynthesis.speak(u);
            }
        }

        function openDesignModal() {
            document.getElementById('designModal').classList.add('active');
        }
        function closeDesignModal() {
            document.getElementById('designModal').classList.remove('active');
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) {
                    toast('Vayra: ' + val + ' समझ गई!');
                    e.target.value = '';
                }
            }
        });
    </script>
</body>
</html>
