/* ============ 2070 ORB (Three.js) ============ */
const canvas=$('orb');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.z=6;
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,3),new THREE.MeshBasicMaterial({color:0x22e6e0,wireframe:true,transparent:true,opacity:0.5}));
const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(0.72,1),new THREE.MeshBasicMaterial({color:0x3b82f6,wireframe:true,transparent:true,opacity:0.75}));
scene.add(core,inner);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.3,'rgba(120,220,255,.35)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})(),color:0x22e6e0,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
glow.scale.set(5,5,1);scene.add(glow);
const pN=350,pPos=new Float32Array(pN*3);
for(let i=0;i<pN;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=1.9+Math.random()*0.7;pPos[i*3]=r*Math.sin(ph)*Math.cos(th);pPos[i*3+1]=r*Math.cos(ph)*0.55;pPos[i*3+2]=r*Math.sin(ph)*Math.sin(th);}
const ringGeo=new THREE.BufferGeometry();ringGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const ring=new THREE.Points(ringGeo,new THREE.PointsMaterial({color:0x8b7cf6,size:0.035,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(ring);
const sN=400,sPos=new Float32Array(sN*3);
for(let i=0;i<sN;i++){sPos[i*3]=(Math.random()-.5)*30;sPos[i*3+1]=(Math.random()-.5)*18;sPos[i*3+2]=-4-Math.random()*14;}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x3b82f6,size:0.05,transparent:true,opacity:0.6})));
const pulse=new THREE.Mesh(new THREE.RingGeometry(1.28,1.34,64),new THREE.MeshBasicMaterial({color:0xff4fd8,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pulse);

const EMOC={happy:0x22e6e0,excited:0x8b7cf6,calm:0x3b82f6,love:0xff4fd8,sad:0x6b7fd7,angry:0xff5a6e};
const curColor=new THREE.Color(0x22e6e0),tgtColor=new THREE.Color(0x22e6e0);
let orbSpeed=0.004,pulseT=0;
function setOrbState(s){
  if(s==='listening'){tgtColor.set(0xff4fd8);orbSpeed=0.010;$('bars').classList.add('on');}
  else if(s==='thinking'){tgtColor.set(0x3b82f6);orbSpeed=0.035;$('bars').classList.remove('on');}
  else if(s==='speaking'){tgtColor.set(0x22e6e0);orbSpeed=0.012;$('bars').classList.remove('on');}
  else{tgtColor.set(EMOC[emotion]||0x22e6e0);orbSpeed=0.004;$('bars').classList.remove('on');}
}
function setOrbEmotion(e){if(state==='idle')tgtColor.set(EMOC[e]||0x22e6e0)}
function resizeOrb(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight*.55;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resizeOrb);
(function loop(){
  requestAnimationFrame(loop);
  resizeOrb();
  curColor.lerp(tgtColor,0.06);
  core.material.color.copy(curColor);glow.material.color.copy(curColor);
  const t=performance.now()*0.001;
  core.rotation.y+=orbSpeed;core.rotation.x+=orbSpeed*0.4;
  inner.rotation.y-=orbSpeed*1.8;inner.rotation.z+=orbSpeed*0.7;
  ring.rotation.z+=orbSpeed*0.9;ring.rotation.y=Math.sin(t*0.5)*0.15;
  const breathe=1+Math.sin(t*2)*0.03;
  let sc=breathe;
  if(state==='listening'){sc=breathe*(1+Math.sin(t*6)*0.05);pulseT+=0.025;pulse.material.opacity=Math.max(0,0.8-pulseT);pulse.scale.setScalar(1+pulseT*1.4);if(pulseT>0.8)pulseT=0;}
  else{pulse.material.opacity*=0.9;}
  if(state==='thinking'){sc=breathe*(1+Math.sin(t*12)*0.06);}
  if(state==='speaking'){sc=breathe*(1+Math.sin(t*9)*0.07);}
  core.scale.setScalar(sc);inner.scale.setScalar(sc*0.95);
  renderer.render(scene,camera);
})();
canvas.addEventListener('pointerdown',()=>{

});

function setState(s){
  state=s;
  const lbl=(cfg.always&&s==='idle')?'READY 🎧':s.toUpperCase();
  const el=$('state');el.textContent=lbl;
  el.style.color=s==='listening'?'var(--pink)':s==='thinking'?'var(--c2)':s==='speaking'?'var(--c1)':'var(--c1)';
  setOrbState(s);
}
function setEmotion(e){emotion=e;setOrbEmotion(e)}

const tools={
  time(){const n=new Date();return `Abhi ${n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} hai.`},
  date(){return new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})},
  weather(){const h=new Date().getHours();const w=h<6?'raat':h<12?'subah':h<17?'dopahar':h<20?'shaam':'raat';return `Abhi ${w} ka time hai.`},
  calc(expr){try{const r=Function('"use strict";return('+String(expr).replace(/[^0-9+\-*/(). %]/g,'')+')')();return String(r)}catch{return 'Calc samajh nahi aaya'}},
  timer(min,text){addReminder(+min,String(text||'Timer khatam'));return `${min} minute ka timer: ${text||'Timer'}`},
  alarm(hhmm,text){const[h,m]=hhmm.split(':').map(Number);const n=new Date(),t=new Date();t.setHours(h,m,0,0);if(t<n)t.setDate(t.getDate()+1);addReminder(Math.round((t-n)/60000),text||'Alarm: '+hhmm);return `${hhmm} ka alarm set.`},
  remember(f){if(f&&!mem.includes(f)){mem.push(String(f));mem=mem.slice(-50000);store.set('v_mem',mem);return `Yaad rakh liya: ${f}`}return 'Pehle se yaad hai'},
  recall(){return mem.length?'Yaad hai: '+mem.join('; '):'Kuch yaad nahi'},
  forget(f){const i=mem.findIndex(x=>x.toLowerCase().includes(String(f).toLowerCase()));if(i>-1){mem.splice(i,1);store.set('v_mem',mem);return 'Bhula diya'}return 'Nahi mila'},
  goal(g){if(g){goals.push({text:String(g),done:false,at:Date.now()});store.set('v_goals',goals);return `Goal add: ${g}`}return goals.length?'Goals: '+goals.map((x,i)=>`${i+1}. ${x.text}${x.done?' ✅':''}`).join(' | '):'Koi goal nahi'},
  goalDone(i){const g=goals[+i-1];if(g){g.done=true;store.set('v_goals',goals);return `Goal complete: ${g.text} 🎉`}return 'Goal nahi mila'},
  joke(){const j=['Programmer ki shaadi mein sabne commit kiya! 😄','WiFi ne WiFi se shaadi ki, connection achha tha! 📶','AI ki favorite chai? Neural-tea! ☕','2070 mein bhi boss ka favorite assistant main hi hoon! 😎'];return j[Math.floor(Math.random()*j.length)]},
  motivate(){const m=['Boss, tum kar sakte ho! 💪 Ek chhota step aaj hi lo.','Har bada kaam ek chhote step se shuru hota hai.','Failure sirf feedback hai, aage badho!','Discipline > Motivation. Aaj 10 minute kaam kar lo.','2070 ka future tumhare haath mein hai, boss! 🚀'];return m[Math.floor(Math.random()*m.length)]},
  summary(){const u=hist.filter(h=>h.role==='user').slice(-5).map(h=>h.content);return u.length?'Recent: '+u.join(' | '):'Abhi koi baat nahi'}
};
function runTool(name,args){const fn=tools[name];if(!fn)return `Tool "${name}" nahi hai.`;try{return fn(...args)}catch(e){return 'Tool error: '+e.message}}

function renderPlan(){const p=$('plan');if(!plan.length){p.style.display='none';return}p.style.display='flex';p.innerHTML='';plan.forEach((s,i)=>{const d=document.createElement('div');d.className='p'+(i<planIdx?' done':i===planIdx?' now':'');d.textContent=(i<planIdx?'✓ ':i===planIdx?'▶ ':'')+s;p.append(d)});p.scrollTop=1e9}

async function ask(text){
  text=text.trim();if(!text)return;
  if(!cfg.key){toast('Pehle API key daalo');openM('set');return}
  setState('thinking');
  pauseListening();
  hist.push({role:'user',content:text});hist=hist.slice(-50000);

  if(cfg.smart){
    try{
      plan=await makePlan(text);planIdx=0;renderPlan();
      let toolResults=[];
      for(let i=0;i<plan.length;i++){
        planIdx=i;renderPlan();
        const step=plan[i];
        const tm=step.match(/^tool:(\w+)\s*(.*)$/);
        if(tm){
          const res=runTool(tm[1],tm[2]?tm[2].split('|').map(s=>s.trim()):[]);
          toolResults.push({tool:tm[1],result:res});
        }
        await new Promise(r=>setTimeout(r,300));
      }
      planIdx=plan.length;renderPlan();
      const reply=await finalAnswer(toolResults);
      finishTurn(reply);
      setTimeout(()=>{plan=[];renderPlan()},2000);
      return;
    }catch(e){}
  }
  simpleAnswer();
}

async function callAI(messages,temp=0.7){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify({model:cfg.model,messages,temperature:temp})});
  const d=await r.json();
  if(!d.choices)throw new Error(d.error?.message||'API error');
  return d.choices[0].message.content;
}

async function makePlan(userText){
  const sys=`You are the planning brain of ${cfg.name}. Given user message, output a plan.
Available tools: time, date, weather, calc, timer(minutes|text), alarm(hh:mm|text), remember(fact), recall, forget(text), goal(text), goalDone(number), joke, motivate, summary.
Simple chat → ["answer"]. Tool helps → include "tool:time" etc. Max 3 steps. Use | for args.
Reply ONLY with a JSON array of strings, no other text.`;
  const raw=await callAI([{role:'system',content:sys},{role:'user',content:userText}],0.3);
  try{return JSON.parse(raw.match(/\[[\s\S]*\]/)[0])}catch{return ['answer']}
}

async function finalAnswer(toolResults){
  const sys=`You are ${cfg.name}, a warm, caring, playful AI assistant. You call the user "boss" with love, like a caring daughter. Talk in simple Hinglish. Be affectionate. Remember everything about boss. Keep replies short (1-3 sentences).
Current time: ${new Date().toString()}.
Known facts about boss: ${mem.join('; ')||'none'}.
${toolResults.length?'Tool results:\n'+toolResults.map(t=>`${t.tool}:${t.result}`).join('\n'):''}
Reply ONLY with JSON: {"reply":"...","emotion":"happy|sad|angry|calm|excited|love","remember":null or "short durable fact","reminder":null or {"minutes":number,"text":"..."}}`;
  const raw=await callAI([{role:'system',content:sys},...hist.slice(-30)],0.7);
  let o;try{o=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch{o={reply:raw}}
  handleMeta(o);
  return String(o.reply||raw);
}

async function simpleAnswer(){
  const sys=`You are ${cfg.name}, a warm, caring, playful AI assistant. You call the user "boss" with love, like a caring daughter. Talk in simple Hinglish. Be affectionate. Remember everything about boss. Keep replies short (1-3 sentences). Current time: ${new Date().toString()}. Known facts: ${mem.join('; ')||'none'}.
Reply ONLY with JSON: {"reply":"...","emotion":"happy|sad|angry|calm|excited|love","remember":null or "fact","reminder":null or {"minutes":number,"text":"..."}}`;
  try{
    const raw=await callAI([{role:'system',content:sys},...hist.slice(-30)],0.7);
    let o;try{o=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch{o={reply:raw}}
    handleMeta(o);
    finishTurn(String(o.reply||raw));
  }catch(e){setState('idle');resumeListening()}
}

function handleMeta(o){
  if(o.emotion)setEmotion(o.emotion);
  if(o.remember&&!mem.includes(o.remember)){mem.push(String(o.remember));mem=mem.slice(-50000);store.set('v_mem',mem)}
  if(o.reminder&&+o.reminder.minutes>0)addReminder(+o.reminder.minutes,String(o.reminder.text||'Yaad dilana'));
}

function finishTurn(reply){
  hist.push({role:'assistant',content:reply});hist=hist.slice(-50000);store.set('v_hist',hist);
  speak(reply);
}

function startAlwaysListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Is browser mein voice nahi hai');return}
  isListening=true;busy=false;
  listenLoop();
}
function stopAlwaysListen(){
  isListening=false;
  if(rec){try{rec.abort()}catch{}rec=null}
  busy=false;
  setState('idle');
}
function pauseListening(){busy=true;if(rec){try{rec.abort()}catch{}rec=null}}
function resumeListening(){busy=false;if(isListening&&cfg.always)setTimeout(()=>listenLoop(),400)}

function listenLoop(){
  if(!isListening||busy)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  if(rec){try{rec.abort()}catch{}}
  rec=new SR();
  rec.lang=cfg.lang;
  rec.continuous=true;
  rec.interimResults=true;
  rec.maxAlternatives=1;
  rec.onstart=()=>{setState('listening')};
  rec.onresult=e=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalText+=e.results[i][0].transcript;
    }
    if(finalText.trim()){
      ask(finalText.trim());
    }
  };
  rec.onerror=(ev)=>{
    if(ev.error==='no-speech'||ev.error==='aborted'){return}
    setTimeout(()=>{if(isListening&&!busy)listenLoop()},1000);
  };
  rec.onend=()=>{
    if(isListening&&!busy){
      setTimeout(()=>listenLoop(),300);
    }
  };
  try{rec.start()}catch{setTimeout(()=>listenLoop(),1000)}
}

function speak(t){
  if(!('speechSynthesis' in window)){setState('idle');resumeListening();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=cfg.lang;u.rate=0.95;u.pitch=1.4;u.volume=0.9;
  const voices=speechSynthesis.getVoices();
  const femaleVoice=voices.find(v=>v.lang===cfg.lang && (v.name.includes('female')||v.name.includes('Google')||v.name.includes('Lekha')||v.name.includes('Swara')||v.name.includes('Heera')));
  if(femaleVoice)u.voice=femaleVoice;
  else if(voices.length>0)u.voice=voices[0];
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>{setState('idle');resumeListening()};
  speechSynthesis.speak(u);
}

function showList(title,arr,del){
  $('it').textContent=title;const b=$('ib');b.innerHTML='';
  if(!arr.length)b.textContent='Abhi kuch nahi hai...';
  arr.forEach((x,i)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=x.text||x;const bt=document.createElement('button');bt.textContent='✕';bt.onclick=()=>{del(i);showList(title,arr,del)};d.append(s,bt);b.append(d)});
  openM('info');
}
function showMem(){showList('MEMORY',mem,i=>{mem.splice(i,1);store.set('v_mem',mem)})}
function showRem(){showList('REMINDERS',rem.map(r=>({text:new Date(r.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' — '+r.text})),i=>{rem.splice(i,1);store.set('v_rem',rem)})}
function showGoals(){
  $('it').textContent='GOALS';const b=$('ib');b.innerHTML='';
  if(!goals.length)b.textContent='Koi goal nahi...';
  goals.forEach((g,i)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=(g.done?'✅ ':'')+g.text;const bt=document.createElement('button');bt.textContent=g.done?'↺':'✓';bt.style.color=g.done?'#8fe':'#6f6';bt.onclick=()=>{g.done=!g.done;store.set('v_goals',goals);showGoals()};d.append(s,bt);b.append(d)});
  const inp=document.createElement('input');inp.placeholder='Naya goal...';inp.style.cssText='width:100%;padding:10px;background:#001018;border:1px solid #22e6e066;border-radius:8px;color:#fff;margin-top:8px';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){goals.push({text:inp.value.trim(),done:false,at:Date.now()});store.set('v_goals',goals);showGoals()}};
  b.append(inp);openM('info');
}
function addReminder(min,text){
  const r={id:Date.now()+Math.random(),at:Date.now()+min*60000,text};
  rem.push(r);store.set('v_rem',rem);schedule(r);
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
}
function schedule(r){
  setTimeout(()=>{
    if(!rem.some(x=>x.id===r.id))return;
    rem=rem.filter(x=>x.id!==r.id);store.set('v_rem',rem);
    const t='Boss, yaad dilana: '+r.text;speak(t);
    if('Notification' in window&&Notification.permission==='granted')new Notification(cfg.name,{body:r.text});
  },Math.max(r.at-Date.now(),0));
}
rem.forEach(schedule);

setTimeout(()=>{ if(cfg.always !== false) startAlwaysListen(); }, 500);
</script>
