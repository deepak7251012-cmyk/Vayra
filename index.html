<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VAYRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#dff;font-family:system-ui,'Segoe UI',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
.top{display:flex;justify-content:space-between;font-size:12px;color:#8fe}
.top b{display:block;font-size:15px;color:#fff;font-weight:500}
.top div:last-child{text-align:right}
h1{text-align:center;font-weight:300;letter-spacing:.35em;font-size:28px;margin:4px 0;background:linear-gradient(90deg,#22e6e0,#3b82f6);-webkit-background-clip:text;color:transparent}
#orb{flex:1;min-height:0;width:100%}
#state{text-align:center;font-size:11px;letter-spacing:.2em;color:#22e6e0;height:16px}
#log{max-height:22vh;overflow-y:auto;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.m{padding:7px 11px;border-radius:12px;font-size:13px;max-width:85%;line-height:1.4}
.user{align-self:flex-end;background:#0c2a3a;border:1px solid #22e6e055}
.ai{align-self:flex-start;background:#13112b;border:1px solid #8b7cf655}
.sys{align-self:center;color:#f88;font-size:12px}
.bar{display:flex;gap:10px;align-items:center}
#in{flex:1;background:#06141c;border:1px solid #22e6e0;border-radius:12px;color:#fff;padding:12px;font-size:15px;outline:none}
#mic{width:52px;height:52px;border-radius:50%;border:2px solid #8b7cf6;background:radial-gradient(circle,#2a6ad0,#1a2a6a);font-size:22px;color:#fff;box-shadow:0 0 18px #8b7cf6}
#mic.on{border-color:#22e6e0;box-shadow:0 0 28px #22e6e0}
nav{display:flex;justify-content:space-around;margin-top:8px}
nav button{background:none;border:none;color:#8fe;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav i{font-style:normal;font-size:20px}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:9;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;flex-direction:column;overflow-y:auto}
.modal.open{display:flex}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{color:#22e6e0;letter-spacing:.15em;font-size:17px}
.x{background:none;border:2px solid #f44;color:#f44;border-radius:50%;width:34px;height:34px;font-size:16px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:#22e6e0}
.f input,.f select{background:#001018;border:1px solid #22e6e066;border-radius:8px;padding:10px;color:#fff;font-size:14px}
.f.row{flex-direction:row;align-items:center;justify-content:space-between}
.btn{width:100%;padding:12px;margin-top:6px;background:#22e6e022;border:2px solid #22e6e0;color:#22e6e0;border-radius:12px;font-size:15px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px;margin-bottom:8px;border-left:3px solid #22e6e0;background:#001a24;border-radius:8px;font-size:13px}
.item button{background:none;border:none;color:#f66;font-size:15px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#022;border:1px solid #22e6e0;color:#22e6e0;padding:9px 18px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:85%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div>TIME<b id="time">--:--</b>BATTERY<b id="bat">--%</b></div>
  <div>DATE<b id="date">---</b>SIGNAL<b id="net">--</b></div>
</div>
<h1 id="title">VAYRA</h1>
<canvas id="orb"></canvas>
<div id="state">IDLE</div>
<div id="log"></div>
<div class="bar">
  <input id="in" placeholder="Type message or tap to speak..." autocomplete="off">
  <button id="mic">🎤</button>
</div>
<nav>
  <button onclick="openM('set')"><i>⚙️</i>Settings</button>
  <button onclick="showMem()"><i>🧠</i>Memory</button>
  <button onclick="showRem()"><i>🔔</i>Reminders</button>
  <button onclick="clearChat()"><i>🗑️</i>Clear</button>
</nav>

<div class="modal" id="set">
  <div class="mh"><h2>SETTINGS</h2><button class="x" onclick="closeM('set')">✕</button></div>
  <div class="f"><label>🔑 OpenRouter API Key</label><input type="password" id="s-key" placeholder="sk-or-v1-..."></div>
  <div class="f row"><label>👁️ Key dikhao</label><input type="checkbox" onchange="$('s-key').type=this.checked?'text':'password'"></div>
  <div class="f"><label>👤 Naam</label><input id="s-name"></div>
  <div class="f"><label>🤖 Model</label><input id="s-model"></div>
  <div class="f"><label>🔊 Bhasha</label><select id="s-lang"><option value="hi-IN">हिंदी</option><option value="en-IN">English</option></select></div>
  <div class="f row"><label>🎙️ Bolne ke baad khud sunna (auto-listen)</label><input type="checkbox" id="s-auto"></div>
  <button class="btn" onclick="saveCfg()">💾 Save</button>
</div>

<div class="modal" id="info">
  <div class="mh"><h2 id="it"></h2><button class="x" onclick="closeM('info')">✕</button></div>
  <div id="ib"></div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let cfg=Object.assign({key:'',name:'VAYRA',model:'meta-llama/llama-3.3-70b-instruct',lang:'hi-IN',auto:false},store.get('v_cfg',{}));
let mem=store.get('v_mem',[]),hist=store.get('v_hist',[]),rem=store.get('v_rem',[]);
let state='idle',emotion='happy';

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function openM(id){if(id==='set'){$('s-key').value=cfg.key;$('s-name').value=cfg.name;$('s-model').value=cfg.model;$('s-lang').value=cfg.lang;$('s-auto').checked=cfg.auto}$(id).classList.add('open')}
function closeM(id){$(id).classList.remove('open')}
function saveCfg(){cfg={key:$('s-key').value.trim(),name:$('s-name').value.trim()||'VAYRA',model:$('s-model').value.trim(),lang:$('s-lang').value,auto:$('s-auto').checked};store.set('v_cfg',cfg);$('title').textContent=cfg.name.toUpperCase();toast('Saved ✨');closeM('set')}
$('title').textContent=cfg.name.toUpperCase();

// ---------- Time / battery / network ----------
function tick(){const n=new Date();$('time').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}).toUpperCase()}
tick();setInterval(tick,1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>$('bat').textContent=Math.round(b.level*100)+'%';u();b.onlevelchange=u});
$('net').textContent=navigator.connection?.effectiveType?.toUpperCase()||(navigator.onLine?'ONLINE':'OFFLINE');

// ---------- Chat log ----------
function addLog(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('log').append(d);while($('log').children.length>30)$('log').firstChild.remove();$('log').scrollTop=1e9}
hist.forEach(h=>addLog(h.role==='user'?'user':'ai',h.content));
function clearChat(){hist=[];store.set('v_hist',hist);$('log').innerHTML='';toast('Chat saaf')}

function setState(s){state=s;$('state').textContent=s.toUpperCase();$('mic').classList.toggle('on',s==='listening')}

// ---------- AI ----------
async function ask(text){
  text=text.trim();if(!text)return;
  addLog('user',text);
  if(!cfg.key){toast('Pehle API key daalo');openM('set');return}
  setState('thinking');
  hist.push({role:'user',content:text});hist=hist.slice(-12);
  const sys=`You are ${cfg.name}, a warm, playful personal AI assistant. Talk in simple Hinglish like a close friend, 1-3 short sentences. Current time: ${new Date().toString()}. Known facts about the user: ${mem.join('; ')||'none'}.
Reply ONLY with a JSON object, no other text: {"reply":"...","emotion":"happy|sad|angry|calm","remember":null or "a short durable fact about the user worth remembering","reminder":null or {"minutes":number,"text":"what to remind"}}`;
  try{
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},...hist]})});
    const d=await r.json();
    if(!d.choices)throw new Error(d.error?.message||'API error');
    const raw=d.choices[0].message.content;let o;
    try{o=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch{o={reply:raw}}
    const reply=String(o.reply||raw);
    if(['happy','sad','angry','calm'].includes(o.emotion))emotion=o.emotion;
    if(o.remember&&!mem.includes(o.remember)){mem.push(String(o.remember));mem=mem.slice(-50);store.set('v_mem',mem)}
    if(o.reminder&&+o.reminder.minutes>0)addReminder(+o.reminder.minutes,String(o.reminder.text||'Yaad dilana'));
    hist.push({role:'assistant',content:reply});hist=hist.slice(-12);store.set('v_hist',hist);
    addLog('ai',reply);speak(reply);
  }catch(e){setState('idle');addLog('sys','Error: '+e.message)}
}
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=$('in').value;$('in').value='';ask(v)}});

// ---------- Voice ----------
function speak(t){
  if(!('speechSynthesis' in window)){setState('idle');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=cfg.lang;
  const v=speechSynthesis.getVoices().find(v=>v.lang===cfg.lang);if(v)u.voice=v;
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>{setState('idle');if(cfg.auto)listen()};
  speechSynthesis.speak(u);
}
let rec;
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Is browser mein voice nahi hai');
  speechSynthesis.cancel();
  try{rec&&rec.abort()}catch{}
  rec=new SR();rec.lang=cfg.lang;
  rec.onstart=()=>setState('listening');
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.onerror=()=>setState('idle');
  rec.onend=()=>{if(state==='listening')setState('idle')};
  rec.start();
}
$('mic').onclick=()=>{if(state==='listening'){rec.stop()}else if(state==='speaking'){speechSynthesis.cancel();setState('idle')}else listen()};

// ---------- Memory & Reminders ----------
function showList(title,arr,del){
  $('it').textContent=title;const b=$('ib');b.innerHTML='';
  if(!arr.length)b.textContent='Abhi kuch nahi hai...';
  arr.forEach((x,i)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=x.text||x;const bt=document.createElement('button');bt.textContent='✕';bt.onclick=()=>{del(i);showList(title,arr,del)};d.append(s,bt);b.append(d)});
  openM('info');
}
function showMem(){showList('MEMORY',mem,i=>{mem.splice(i,1);store.set('v_mem',mem)})}
function showRem(){showList('REMINDERS',rem.map(r=>({text:new Date(r.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' — '+r.text})),i=>{rem.splice(i,1);store.set('v_rem',rem)})}
function addReminder(min,text){
  const r={id:Date.now()+Math.random(),at:Date.now()+min*60000,text};
  rem.push(r);store.set('v_rem',rem);schedule(r);
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  toast('Reminder set: '+min+' min baad');
}
function schedule(r){
  setTimeout(()=>{
    if(!rem.some(x=>x.id===r.id))return;
    rem=rem.filter(x=>x.id!==r.id);store.set('v_rem',rem);
    const t='Yaad dilana: '+r.text;addLog('ai',t);speak(t);
    if('Notification' in window&&Notification.permission==='granted')new Notification(cfg.name,{body:r.text});
  },Math.max(r.at-Date.now(),0));
}
rem.forEach(schedule);

// ---------- ORB ----------
const cv=$('orb'),ctx=cv.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
const EMO={happy:[34,230,224],sad:[90,140,255],angry:[255,80,80],calm:[139,124,246]};
let col=[...EMO.happy],level=0,t=0;
const N=1000,pts=[];
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.399963;pts.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,s:Math.random()*6.28,p:Math.random()>.7})}
function ring(cx,cy,r,w,c,rot,dash,gap,al){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle=c;ctx.globalAlpha=al;ctx.lineWidth=w;ctx.setLineDash([dash,gap]);ctx.shadowColor=c;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.stroke();ctx.restore()}
function frame(){
  t+=.016;
  const tg=EMO[emotion];for(let i=0;i<3;i++)col[i]+=(tg[i]-col[i])*.05;
  const C=`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
  let target=0;
  if(state==='speaking')target=.35+.65*Math.abs(Math.sin(t*9)*Math.sin(t*5.3+1));
  else if(state==='listening')target=.2+.15*Math.sin(t*4);
  else if(state==='thinking')target=.1;
  level+=(target-level)*.15;
  const boost=(state==='thinking'?3:1)+level*2.5;
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*.27;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.4);
  g.addColorStop(0,`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${.12+level*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ring(cx,cy,R*1.62,2.5,C,0,2000,0,.9);
  ring(cx,cy,R*1.5,1.5,C,t*.3*boost,3,9,.7);
  ring(cx,cy,R*1.38,2,'#3b82f6',-t*.4*boost,260,40,.9);
  ring(cx,cy,R*1.28,2,'#8b7cf6',t*.6*boost,160,60,.9);
  ring(cx,cy,R*1.18,1.5,C,-t*.9*boost,40,20,.8);
  ring(cx,cy,R*.62+level*8,3,C,t*1.2*boost,90,50,.95);
  ring(cx,cy,R*.4+level*6,2,'#8b7cf6',-t*1.6*boost,50,30,.9);
  const ry=t*.35*(1+level*2),cs=Math.cos(ry),sn=Math.sin(ry),list=[];
  for(const p of pts){
    const wob=1+level*.22*Math.sin(t*8+p.s*3)+level*.06*Math.sin(p.s*7+t*3);
    list.push([(p.x*cs+p.z*sn)*wob,p.y*wob,(-p.x*sn+p.z*cs)*wob,p.p]);
  }
  list.sort((a,b)=>a[2]-b[2]);
  ctx.shadowBlur=0;ctx.setLineDash([]);
  for(const [x,y,z,pp] of list){
    const k=(z+1)/2;ctx.globalAlpha=.25+k*.75;ctx.fillStyle=pp?'#8b7cf6':C;
    ctx.beginPath();ctx.arc(cx+x*R,cy+y*R,.6+k*1.3+level*.8,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
